<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>Todo App</title>
    </head>
    <body>
        <div id="main">
            <div id="container">
                <h3 id="title">Todo App</h3>
                <form id="add-todo-form">
                    <input
                        id="input"
                        type="text"
                        placeholder="Enter todo title to add"
                        required
                    />
                    <button>Add</button>
                </form>
                <form id="search-todo-form">
                    <input
                        id="input"
                        type="text"
                        placeholder="Enter todo title to search"
                        required
                    />
                    <button>Search</button>
                </form>
                <ul id="todo-list"></>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
