<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo App Practice</title>
    </head>
    <body>
        <main>
            <section>
                <form id="todo-input-form">
                    <input
                        id="todo-input"
                        type="text"
                        placeholder="Enter todo you want to add"
                    />
                    <button id="todo-add-button">Add</button>
                </form>
                <form id="search-input-form">
                    <input
                        id="search-input"
                        type="text"
                        placeholder="Search todo"
                        required
                    />
                    <button id="search-todo-button">Search</button>
                </form>
                <div>
                    <button id="all-button">All</button>
                    <button id="todo-button">Todo</button>
                    <button id="completed-button">Completed</button>
                </div>
                <ul id="todo-list"></ul>
                <button id="mark-all-done-button" style="display: none">
                    Mark all done
                </button>
                <button id="clear-all-button" style="display: none">
                    Clear All
                </button>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
